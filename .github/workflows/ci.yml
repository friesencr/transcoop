name: CI
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Generated templ files are current
        run: |
          go generate ./internal/webui
          git diff --exit-code
      - run: go vet ./...
      - run: go mod tidy -diff
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Test signed binary upgrade
        env:
          TRANSCOOP_UPDATE_INTEGRATION: '1'
        run: go test -count=1 -run TestPackagedUpgrade -v ./internal/update
      - name: Test first install from a signed release
        if: runner.os != 'Windows'
        run: python3 scripts/test-install.py
      - name: Build
        shell: bash
        run: CGO_ENABLED=0 go build ./cmd/transcoop
